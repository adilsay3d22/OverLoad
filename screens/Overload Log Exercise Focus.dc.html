<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:1000},&quot;coachingCue&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;lastExercise&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showRestTimer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Rest timer&quot;},&quot;restSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:92,&quot;min&quot;:30,&quot;max&quot;:300,&quot;step&quot;:15,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Rest timer&quot;}}">class Component extends DCLogic {
  state = { remaining: 92, running: true };

  componentDidMount() {
    this.iv = setInterval(() => {
      this.setState(s => (s.running && s.remaining > 0 ? { remaining: s.remaining - 1 } : (s.running ? { running: false } : null)));
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.iv); }

  fmt(t) {
    const m = Math.floor(t / 60), s = t % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  renderVals() {
    const target = Number(this.props.restSeconds) || 92;
    return {
      hasCue: this.props.coachingCue !== false,
      ctaLabel: this.props.lastExercise === true ? 'Finish Session' : 'Next Exercise',
      restActive: this.props.showRestTimer !== false && this.state.running,
      restLabel: this.fmt(this.state.remaining),
      minus15: () => this.setState(s => ({ remaining: Math.max(0, s.remaining - 15) })),
      plus15: () => this.setState(s => ({ remaining: s.remaining + 15 })),
      skipRest: () => this.setState({ running: false }),
      startRest: () => this.setState({ remaining: target, running: true })
    };
  }
}</script>
