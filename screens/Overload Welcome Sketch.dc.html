<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; }
  a { color: #14150F; }
  a:hover { color: #6E8A16; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 64px 24px; background: #E8E8E6;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="402px,874px">
    <div style="height: 100%; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #FAFAF7; overflow: hidden;">

      <div style="position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); width: 300px; height: 300px; opacity: 0.44;">
        <div style="position: absolute; inset: 0; background-image: url('assets/sketch-dumbbells.png'); background-repeat: no-repeat; background-size: cover; background-position: 50% 50%;"></div>
        <div style="position: absolute; inset: 0; background: #C6F24A; mix-blend-mode: color; opacity: 0.5;"></div>
        <div style="position: absolute; inset: -1px; background: radial-gradient(76% 76% at 50% 50%, rgba(250,250,247,0) 74%, #FAFAF7 100%);"></div>
      </div>

      <div style="position: absolute; left: 0; right: 0; top: 43%; height: 300px; background: radial-gradient(52% 42% at 50% 50%, rgba(250,250,247,0.9) 0%, rgba(250,250,247,0.5) 62%, rgba(250,250,247,0) 100%);"></div>

      <div style="position: relative; flex: none; padding: 58px 26px 0; display: flex; align-items: center; gap: 7px;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="0.5" y="7" width="2.5" height="6" rx="1" fill="#14150F"></rect><rect x="4" y="4.5" width="4" height="11" rx="1.5" fill="#14150F"></rect><rect x="12" y="4.5" width="4" height="11" rx="1.5" fill="#14150F"></rect><rect x="17" y="7" width="2.5" height="6" rx="1" fill="#14150F"></rect><rect x="8" y="8.8" width="4" height="2.4" fill="#14150F"></rect></svg>
        <div style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: #14150F;">Overload</div>
      </div>

      

      <div style="position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 26px 4%;">
        <h1 style="margin: 0; text-align: center; font-size: 38px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 700; color: #14150F; text-wrap: pretty;">Lift More Than Last Week</h1>
        
        <div style="margin-top: 26px; display: flex; gap: 7px;">
          <div style="width: 22px; height: 7px; border-radius: 999px; background: #14150F;"></div>
          <div style="width: 7px; height: 7px; border-radius: 999px; background: #DCDCD2;"></div>
          <div style="width: 7px; height: 7px; border-radius: 999px; background: #DCDCD2;"></div>
        </div><p style="margin: 16px 0 0; max-width: 300px; text-align: center; font-size: 15px; line-height: 1.5; font-weight: 500; color: #5C5C55; text-wrap: pretty;">Log your reps and RPE, follow a program, and let Overload push your next load.</p>
      </div><button style="position: relative; flex: none; margin: 0 26px; cursor: pointer; height: 58px; border-radius: 29px; border: none; background: #C6F24A; font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: #14150F; box-shadow: 0 10px 24px rgba(150,196,40,0.42); transition: background 160ms ease;" style-hover="background: #B7E634;">Create Account</button>

      <div style="position: relative; flex: none; padding: 18px 26px 40px; text-align: center; font-size: 13px; font-weight: 500; color: #6E6E66;">I already have an account. <a href="#" style="font-weight: 700; color: #14150F; text-decoration: none;">Log in</a></div>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:1000}}"></script>
</body>
</html>
